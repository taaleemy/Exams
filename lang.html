<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz on Lesson 2 - Prepared by Mrs. Hend Kandeel</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --correct: #10b981;
            --incorrect: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
            background-image: url('taaleemy.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
            z-index: 1;
            margin-top: 20px;
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: red;
            font-weight: 600;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .timer {
            color: #d97706;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            line-height: 1.5;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #f8fafc;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* Results Screen */
        .results-screen {
            display: none;
            text-align: center;
        }

        .score-box {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }

        .review-section {
            text-align: left;
            margin-top: 30px;
            border-top: 2px solid var(--border);
            padding-top: 20px;
        }

        .review-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .review-item.correct-bg {
            border-left: 5px solid var(--correct);
        }

        .review-item.incorrect-bg {
            border-left: 5px solid var(--incorrect);
        }

        .explanation {
            margin-top: 8px;
            font-size: 0.95rem;
            color: var(--text-muted);
            background: #fff;
            padding: 10px;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .quiz-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="watermark"></div>

    <div class="container">
        <header>
            <h1>Quiz on Lesson 2</h1>
            <div class="subtitle">Prepared by Mrs. Hend Kandeel <br>01151305204</div>
        </header>

        <div id="quiz-box">
            <div class="quiz-header">
                <div>Question <span id="current-num">1</span> of 25</div>
                <div class="timer">⏱️ Remaining: <span id="timer-display">25:00</span></div>
            </div>

            <div id="questions-container"></div>

            <div class="controls">
                <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
                <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next</button>
                <button class="btn btn-primary" id="submit-btn" onclick="finishQuiz()" style="display: none;">Submit Quiz</button>
            </div>
        </div>

        <div id="results-box" class="results-screen">
            <h2>Quiz Finished!</h2>
            <div class="score-box" id="final-score">0 / 25</div>
            <p id="feedback-text"></p>

            <div class="review-section">
                <h3>Answer Review & Error Correction:</h3>
                <div id="review-container"></div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "1. As an AI systems engineer, you were asked to design an email classification system. If you relied on 'Traditional Programming' instead of 'Machine Learning', what primary obstacle would you face?",
                options: [
                    "The inability of the computer to process Arabic and English text together.",
                    "The need to manually write millions of rules and exception statements to keep up with evolving fraud techniques.",
                    "The lack of neural networks capable of understanding email addresses.",
                    "Servers consuming far too much processing power compared to machine learning."
                ],
                correct: 1,
                exp: "Traditional programming relies on fixed rules. In filtering, you would need to write every rule for words and scams manually, which is virtually impossible due to the continuous evolution of spam."
            },
            {
                q: "2. What is the fundamental difference in the working mechanism between a model that predicts house prices based on area (Machine Learning) and a model that generates fictional images of non-existent houses (Generative AI)?",
                options: [
                    "The first extracts patterns to predict a numerical value, while the second uses deep learning to synthesize entirely new data and structures.",
                    "The first relies on neural networks, while the second does not use deep learning.",
                    "The first relies on fixed rules, while the second relies solely on conversation formatting.",
                    "There is no difference; both perform the exact same programming task."
                ],
                correct: 0,
                exp: "Traditional machine learning extracts patterns to make predictions/judgments, whereas generative AI (derived from deep learning) creates new data such as images and text."
            },
            {
                q: "3. Hierarchy of AI technologies: Which of the following expressions describes the containment relationship in a precise structural manner?",
                options: [
                    "Generative AI creates deep learning, and deep learning creates machine learning.",
                    "AI is an umbrella term containing Machine Learning, which contains Deep Learning, which contains Generative AI.",
                    "Machine learning and generative AI are completely separate technologies under the umbrella of neural networks.",
                    "Neural networks represent the overarching umbrella containing General Artificial Intelligence."
                ],
                correct: 1,
                exp: "According to the structural diagram in the lesson (Nested Categories): Artificial Intelligence encompasses Machine Learning, which contains Deep Learning, which contains Generative AI."
            },
            {
                q: "4. Engineering Scenario: An autonomous car system trained using Deep Learning was trained to drive only in sunny weather. When driven during a severe blizzard, the system failed. What is the scientific reason for this according to the lesson?",
                options: [
                    "Because today's AI is Narrow AI, and deep learning relies on learning exclusively from massive data available during training.",
                    "Because the neural network automatically turned into a fixed-rule software system.",
                    "Because Generative AI did not generate new roads during driving.",
                    "Due to a fault in the car's mechanical engine rather than the AI model."
                ],
                correct: 0,
                exp: "Today's artificial intelligence is equivalent to Narrow AI, tailored to specific tasks and data; neural networks in deep learning struggle significantly with unseen or rare scenarios (rarely seen in data)."
            },
            {
                q: "5. How do you explain an Artificial Neural Network simulating human biological neurons to make complex decisions?",
                options: [
                    "By granting the computer human emotions and feelings that enable it to think.",
                    "By connecting simple parts and components into layers that exchange signals to pass along and accumulate patterns.",
                    "By storing commands in fixed binary code that never changes.",
                    "By employing a real-time interpreter between languages."
                ],
                correct: 1,
                exp: "An artificial neural network consists of simple components connected across layers (Input, Hidden, Output layers) working together to process complex data, mimicking brain cell networks."
            },
            {
                q: "6. Developer Scenario: A company developed software that recognizes user voices to unlock doors. This system was classified as (Narrow AI). What does this mean in practical application?",
                options: [
                    "The software can also translate text and write articles with high efficiency and equal skill.",
                    "The software is specialized and dedicated solely to the voice recognition task, unable to make decisions outside this scope.",
                    "The software operates without needing any training data or neural networks.",
                    "The software relies entirely on Generative AI."
                ],
                correct: 1,
                exp: "Current artificial intelligence is described as Narrow AI (expert at one task only), meaning it excels and specializes in performing a single specific task."
            },
            {
                q: "7. If we want to build an application that generates audio clips and source code based on textual prompts, which specific technology is preferred?",
                options: [
                    "Programming using fixed rules.",
                    "Traditional Machine Learning for email filtering.",
                    "Generative AI.",
                    "Artificial General Intelligence (AGI)."
                ],
                correct: 2,
                exp: "Generative AI is responsible for creating new content such as text, images, code, and audio based on prompts."
            },
            {
                q: "8. What is the primary role of Hidden Layers in building an Artificial Neural Network?",
                options: [
                    "Receiving text prompts directly from the end-user.",
                    "Processing data and extracting complex patterns and details between inputs and outputs.",
                    "Permanently saving data and exporting it as PDF files.",
                    "Eliminating the need for training data and relying on human intelligence."
                ],
                correct: 1,
                exp: "Hidden layers in neural networks perform complex mathematical calculations to identify and analyze deep patterns hidden within the data."
            },
            {
                q: "9. An engineer analyzed a product recommendation system in an e-commerce store and a spam filter system. What essential common factor do they share regarding AI mechanism?",
                options: [
                    "Both use Generative AI to create new products and messages.",
                    "Both are applications of Machine Learning that learn patterns from user data to make decisions.",
                    "Both rely on fixed human code that does not adapt to changes in user behavior.",
                    "Both run exclusively on smartphones without computers."
                ],
                correct: 1,
                exp: "Both applications represent Machine Learning, as they learn patterns from past log behaviors and data to predict and evaluate."
            },
            {
                q: "10. In responding to textual prompts via tools like ChatGPT, which technology classified under Deep Learning enables the system to generate coherent responses?",
                options: [
                    "Direct manual analysis performed by the programmer.",
                    "Generative AI.",
                    "Fixed geographic databases.",
                    "Translation systems based strictly on dictionary lookups."
                ],
                correct: 1,
                exp: "ChatGPT is a direct application of innovative Generative AI built on deep learning techniques."
            },
            {
                q: "11. Imagine you are building an AI model to recognize plant diseases. If you supply the model with only 5 images per disease, what result do you expect, and why?",
                options: [
                    "It will yield excellent results because deep learning requires very little data.",
                    "The model will suffer from low accuracy because deep learning requires large-scale data to learn patterns.",
                    "The model will impersonate an agricultural engineer and generate an automated solution.",
                    "The neural network will immediately convert to fixed text rules."
                ],
                correct: 1,
                exp: "Deep Learning requires large-scale data to extract patterns and learn effectively."
            },
            {
                q: "12. Scenario: Your supervisor asked you to choose the appropriate technology to develop an app that translates live speech between speakers of different languages during calls. What is the accurate classification of this technology?",
                options: [
                    "AI based on Deep Learning for voice recognition and translation.",
                    "Simple decision tree programming based on traditional conditional rules.",
                    "Smart animation generation.",
                    "Traditional cloud storage systems."
                ],
                correct: 0,
                exp: "Processing complex real-time audio and translation relies fundamentally on Deep Learning and neural networks (Speech recognition & translation)."
            },
            {
                q: "13. When comparing (Machine Learning) to (Fixed Rules Programming), which statement clearly expresses the key distinction?",
                options: [
                    "In fixed rules, we write instructions manually; in machine learning, we extract rules and patterns from data.",
                    "Machine learning does not require a computer to run, unlike fixed rules.",
                    "Fixed rules generate images and videos, whereas machine learning does not.",
                    "Machine learning is used exclusively in industrial robotics."
                ],
                correct: 0,
                exp: "The key distinction: Traditional Programming = Fixed rules hand-written by humans. Machine Learning = Learning patterns automatically from data."
            },
            {
                q: "14. Which of the following represents the correct sequence going from the most general concepts to the most specialized technologies?",
                options: [
                    "Generative AI -> Deep Learning -> Machine Learning -> AI",
                    "AI -> Machine Learning -> Deep Learning -> Generative AI",
                    "Deep Learning -> AI -> Generative AI -> Machine Learning",
                    "Machine Learning -> AI -> Deep Learning -> Generative AI"
                ],
                correct: 1,
                exp: "According to the hierarchy stated in the text: Artificial Intelligence (General) -> Machine Learning -> Deep Learning -> Generative AI."
            },
            {
                q: "15. Why is 'Artificial Intelligence' (AI) considered a general term?",
                options: [
                    "Because it is limited strictly to talking robots.",
                    "Because it encompasses any technology that reproduces or performs intelligent human behavior (learning, reasoning, judgment, etc.).",
                    "Because it only describes modern devices manufactured after 2023.",
                    "Because it inevitably relies on writing code manually without data."
                ],
                correct: 1,
                exp: "Definition of AI in the lesson document: 'A general term for technologies that reproduce or perform intelligent human behavior (learning, reasoning, judgment, etc.).'"
            },
            {
                q: "16. Engineering Scenario: If a weather forecasting system based on deep learning fails to predict a rare weather phenomenon that hasn't occurred in 100 years, what is the primary analytical cause?",
                options: [
                    "The artificial neural network suffered physical breakage.",
                    "The model lacked sufficient data (rarely seen in data) regarding this phenomenon during the training phase.",
                    "The system transformed into Artificial General Intelligence.",
                    "Weather phenomena cannot be predicted at all by any technology."
                ],
                correct: 1,
                exp: "As noted in the PAUSE & THINK sections: Deep learning models struggle significantly with inputs that were rarely or never seen during training."
            },
            {
                q: "17. What is the primary function of the Input Layer in the structural architecture of a neural network?",
                options: [
                    "Delivering the final decision to the end-user.",
                    "Generating new images and videos.",
                    "Receiving raw data (such as images, sounds, or numbers) and passing it to subsequent layers.",
                    "Self-modifying the software's source code."
                ],
                correct: 2,
                exp: "The Input Layer is the entry point that receives raw data and information to pass through the network."
            },
            {
                q: "18. Which criteria leads us to classify a chatbot app under Generative AI rather than Traditional Machine Learning?",
                options: [
                    "Its ability to respond with new, unique text structures and answers that were not literally pre-stored.",
                    "Its ability only to categorize messages into important and spam.",
                    "Its ability to work without a computer or internet connection.",
                    "Its complete reliance on clicking pre-defined selection buttons."
                ],
                correct: 0,
                exp: "Generative AI is defined by its ability to create new content (new text, images, audio) rather than just classifying existing content."
            },
            {
                q: "19. If you were asked to design an employee facial recognition system for attendance tracking, which technology forms the core of this modern app?",
                options: [
                    "Deep Learning using Neural Networks.",
                    "Traditional programming with manual conditional statements (If/Else).",
                    "Text processing using spreadsheets.",
                    "Generative General AI for storytelling."
                ],
                correct: 0,
                exp: "Image analysis and facial recognition rely primarily on Deep Learning and Neural Networks."
            },
            {
                q: "20. An environmental engineer wants to utilize AI to monitor water quality. What is the most critical first step to build a successful Machine Learning model?",
                options: [
                    "Writing a thousand manual conditional lines for water quality rules.",
                    "Collecting and organizing a large, diverse dataset of water samples for the model to learn patterns from.",
                    "Purchasing a very large monitor.",
                    "Relying solely on text translation."
                ],
                correct: 1,
                exp: "Machine learning relies completely on learning patterns from data, making proper data provision the foundation of learning."
            },
            {
                q: "21. Based on what you studied, can Generative AI work effectively without Deep Learning?",
                options: [
                    "Yes, because Generative AI is a completely separate technology.",
                    "No, because Generative AI is primarily built as a specialized subset within Deep Learning.",
                    "Yes, by using old fixed programming rules.",
                    "No, because Generative AI precedes Deep Learning in the hierarchy."
                ],
                correct: 1,
                exp: "According to the text: 'Today's generative AI systems are built on deep learning.' Generative AI is designed inside deep learning techniques."
            },
            {
                q: "22. What is the exact meaning of the statement 'Today's AI is Narrow' as presented in the document?",
                options: [
                    "Current AI is highly intelligent across all fields, just like humans.",
                    "Current AI is specialized and proficient in performing only one specific task and cannot automatically exceed it.",
                    "AI systems only operate on narrow smartphone screens.",
                    "Current technology suffers from limited storage space."
                ],
                correct: 1,
                exp: "Stated in the text: 'Today's AI is narrow - expert at one task only', meaning it is expert in executing one single specific task."
            },
            {
                q: "23. In natural language processing, when a translation application converts text from Arabic to English, what does the system do based on AI methodology?",
                options: [
                    "Replaces each word via literal dictionary matching without considering context.",
                    "Analyzes linguistic patterns and relationships from data to generate an accurate and context-appropriate translation.",
                    "Connects to a human translator to translate text in real-time.",
                    "Relies strictly on fixed rules entered in 1990."
                ],
                correct: 1,
                exp: "AI translation systems use deep learning to master patterns and structures across languages to generate the most appropriate translation."
            },
            {
                q: "24. Decision-Making Scenario: A gaming company wants to create characters that converse and generate new, unrepeated dialogue with players during gameplay. Which technology should be deployed?",
                options: [
                    "Programming with pre-defined fixed rules.",
                    "Generative AI.",
                    "Email spam filtering application.",
                    "Static statistical spreadsheets."
                ],
                correct: 1,
                exp: "To generate dynamic, non-preprogrammed dialogue (New text/speech), Generative AI must be used."
            },
            {
                q: "25. What is the primary difference between the Output Layer and the Input Layer in neural network components?",
                options: [
                    "The input layer receives raw data, while the output layer presents the model's final decision or prediction.",
                    "The output layer aggregates data, while the input layer issues commands.",
                    "There is no difference; both perform the same role interchangeably.",
                    "The input layer contains actual biological human neurons."
                ],
                correct: 0,
                exp: "The Input layer receives raw input data at the start, whereas the Output layer outputs the final decision or prediction."
            }
        ];

        let currentQuestion = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timerSeconds = 25 * 60;
        let timerInterval;

        function initQuiz() {
            renderQuestions();
            startTimer();
            showQuestion(0);
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = `question-card ${index === 0 ? 'active' : ''}`;
                card.id = `q-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <button class="option-btn" onclick="selectOption(${index}, ${optIndex})">
                            ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid">${optionsHTML}</div>
                `;

                container.appendChild(card);
            });
        }

        function showQuestion(index) {
            document.querySelectorAll('.question-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`q-${index}`).classList.add('active');
            
            document.getElementById('current-num').innerText = index + 1;

            // Update option styles
            const currentCard = document.getElementById(`q-${index}`);
            const buttons = currentCard.querySelectorAll('.option-btn');
            buttons.forEach((btn, optIdx) => {
                if (userAnswers[index] === optIdx) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            // Update Controls
            document.getElementById('prev-btn').disabled = (index === 0);
            
            if (index === questions.length - 1) {
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'inline-block';
            } else {
                document.getElementById('next-btn').style.display = 'inline-block';
                document.getElementById('submit-btn').style.display = 'none';
            }
        }

        function selectOption(qIdx, optIdx) {
            userAnswers[qIdx] = optIdx;
            showQuestion(qIdx);
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestion);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds--;
                let minutes = Math.floor(timerSeconds / 60);
                let seconds = timerSeconds % 60;
                
                document.getElementById('timer-display').innerText = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                }
            }, 1000);
        }

        function finishQuiz() {
            clearInterval(timerInterval);

            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('results-box').style.display = 'block';

            let score = 0;
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = '';

            questions.forEach((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correct;
                if (isCorrect) score++;

                const reviewItem = document.createElement('div');
                reviewItem.className = `review-item ${isCorrect ? 'correct-bg' : 'incorrect-bg'}`;

                const userAnsText = userAnswers[idx] !== null ? q.options[userAnswers[idx]] : "Not Answered";
                const correctAnsText = q.options[q.correct];

                reviewItem.innerHTML = `
                    <div style="font-weight: bold; margin-bottom: 5px;">${q.q}</div>
                    <div>Your Answer: <span style="color: ${isCorrect ? 'var(--correct)' : 'var(--incorrect)'}; font-weight: bold;">${userAnsText}</span></div>
                    ${!isCorrect ? `<div>Correct Answer: <span style="color: var(--correct); font-weight: bold;">${correctAnsText}</span></div>` : ''}
                    <div class="explanation">💡 <b>Explanation & Analysis:</b> ${q.exp}</div>
                `;

                reviewContainer.appendChild(reviewItem);
            });

            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
            
            let feedback = "";
            if (score >= 22) feedback = "Excellent! Outstanding performance and deep understanding of AI concepts and engineering problem-solving.";
            else if (score >= 17) feedback = "Very Good! Strong performance and analysis, with just a few minor details to review.";
            else if (score >= 12) feedback = "Average performance. You should revisit the lesson to reinforce key differences between techniques and scenarios.";
            else feedback = "Needs revision. It is recommended to review the lesson content once more for better comprehension.";

            document.getElementById('feedback-text').innerText = feedback;
        }

        // Initialize on load
        window.onload = initQuiz;
    </script>
</body>
</html>
